id: "web-surface-audit"
name: "Web Application Defensive Header & TLS Audit"
version: "1.0"
category: "web_assessment"
description: >
  Focused read-only audit of web application response headers, clickjacking and
  XSS defense-in-depth controls, transport encryption, and cache hygiene.
max_steps: 4
expand_wildcard_subdomains: false
steps:
  - stage: "http_posture"
    tool: "http_headers"
    params:
      method: "GET"
    rationale: "Collect full HTTP security header baseline on target root/probe endpoint."
  - stage: "tls_hygiene"
    tool: "tls_inspect"
    params:
      port: 443
    on_ip_target: "skip"
    rationale: "Evaluate TLS handshake protocol and X.509 certificate lifecycle."
prioritization_rules:
  missing_hsts_severity: "medium"
  missing_csp_severity: "medium"
  missing_xcto_severity: "low"
  missing_permissions_policy_severity: "low"
  missing_coop_severity: "info"
  expiring_cert_days_high: 14
  expiring_cert_days_medium: 30
  legacy_tls_severity: "high"
report_focus: >
  Evaluate browser-side defense-in-depth controls, distinguish true exposure on
  interactive HTML apps from benign omissions on pure JSON endpoints, and flag
  CSP/auth context for human review.
